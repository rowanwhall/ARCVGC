<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARC</title>
    <base href="/">
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">

    <!-- Open Graph (Discord, Facebook, etc.) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="ARC">
    <meta property="og:description" content="Browse and search data from Showdown replays">
    <meta property="og:image" content="https://arcvgc.com/arc-logo.png?v=2">
    <meta property="og:url" content="https://arcvgc.com">
    <meta property="og:site_name" content="ARC">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://arcvgc.com/arc-logo.png?v=2">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        #loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            background: #FEF7FF;
        }
        #loading .spinner {
            width: 96px;
            height: 96px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            animation: frames 460ms steps(1) infinite;
        }
        @media (prefers-color-scheme: dark) {
            #loading {
                background: #141218;
            }
        }
        @keyframes frames {
            0%      { background-image: url('loading_frame_0.png'); }
            28.26%  { background-image: url('loading_frame_1.png'); }
            50%     { background-image: url('loading_frame_2.png'); }
            78.26%  { background-image: url('loading_frame_3.png'); }
        }
    </style>
</head>
<body>
<div id="loading">
    <div class="spinner"></div>
</div>
<script
    src="https://browser.sentry-cdn.com/9.15.0/bundle.min.js"
    crossorigin="anonymous"
></script>
<script>
    // Skiko (Compose for Web's renderer) has no WebGL context-loss recovery.
    // Browsers evict GPU contexts from long-backgrounded tabs; after that the
    // wasm runtime keeps handling input but nothing repaints, leaving the app
    // frozen until a manual refresh. Recover by reloading — every page mirrors
    // its state into the URL, so a reload restores the user's location.
    // Note: never call canvas.getContext() here — doing so before Skiko would
    // create the context with the wrong attributes. Rely on the event only.
    (function () {
        var RELOAD_GUARD_KEY = 'arc-webgl-reload-at';
        var RELOAD_GUARD_MS = 30000;
        var reloadPending = false;

        function requestReload() {
            // Reloading a hidden tab risks immediate re-eviction; wait for the
            // user to come back so the fresh context sticks.
            if (document.visibilityState !== 'visible') {
                document.addEventListener('visibilitychange', function onVisible() {
                    if (document.visibilityState !== 'visible') return;
                    document.removeEventListener('visibilitychange', onVisible);
                    requestReload();
                });
                return;
            }
            // Storage access can throw when cookies/storage are blocked; the
            // guard is best-effort — fail open so recovery still happens.
            var last = 0;
            try { last = Number(sessionStorage.getItem(RELOAD_GUARD_KEY)) || 0; } catch (e) { }
            var wait = last + RELOAD_GUARD_MS - Date.now();
            if (wait > 0) {
                // Reloaded for this reason moments ago and the context died
                // again — pace retries to once per guard window, don't loop.
                setTimeout(requestReload, wait);
                return;
            }
            try { sessionStorage.setItem(RELOAD_GUARD_KEY, String(Date.now())); } catch (e) { }
            if (typeof Sentry !== 'undefined' && Sentry.captureMessage) {
                Sentry.captureMessage('WebGL context lost — auto-reloading', 'warning');
                if (typeof Sentry.flush === 'function') {
                    // Let the event reach the network before navigating away.
                    var reload = function () { location.reload(); };
                    Sentry.flush(2000).then(reload, reload);
                    return;
                }
            }
            location.reload();
        }

        function onContextLost() {
            if (reloadPending) return;
            reloadPending = true;
            requestReload();
        }

        var watched = new WeakSet();
        function watchCanvases() {
            document.querySelectorAll('canvas').forEach(function (canvas) {
                if (watched.has(canvas)) return;
                watched.add(canvas);
                canvas.addEventListener('webglcontextlost', onContextLost);
            });
        }

        // The Compose canvas is created by the wasm app after load — watch for it.
        new MutationObserver(watchCanvases)
            .observe(document.body, { childList: true, subtree: true });
        watchCanvases();
    })();
</script>
<script src="webApp.js"></script>
</body>
</html>
